[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analisisestadistico"
version = "0.2.0"
description = "Proyecto de análisis estadístico para datasets de Machine Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scipy>=1.15.3",
    "statistics>=1.0.3.5",
]
