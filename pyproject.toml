[project]
name = "analisisestadistico"
version = "0.1.0"
description = "Clase para estudiar las variables numéricas y categóricas de cualquier conjunto de datos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
    "statistics>=1.0.3.5",
]

[project.scripts]
analisisestadistico = "analisisestadistico:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
